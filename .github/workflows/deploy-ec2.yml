
name: Deploy AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: devops-python-api
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e enviar imagem Docker
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy na instancia EC2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          ssh -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "bash -se" -- "$AWS_REGION" "$REGISTRY" "$IMAGE" <<'REMOTE'
          set -euo pipefail

          REGION="$1"
          REGISTRY="$2"
          IMAGE="$3"

          aws ecr get-login-password --region "$REGION" |
            sudo docker login \
              --username AWS \
              --password-stdin "$REGISTRY"

          sudo docker pull "$IMAGE"

          sudo docker rm -f devops-python-api || true

          sudo docker run -d \
            --name devops-python-api \
            --restart unless-stopped \
            -p 8000:8000 \
            "$IMAGE"

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "Deploy realizado com sucesso!"
              exit 0
            fi
            sleep 3
          done

          sudo docker logs devops-python-api
          exit 1
          REMOTE
