
name: Deploy AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar e executar API na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd ~/Trabalho-api

          git fetch origin main
          git reset --hard origin/main

          sudo docker build -t devops-python-api .

          sudo docker rm -f devops-python-api || true

          sudo docker run -d \
            --name devops-python-api \
            --restart unless-stopped \
            -p 8000:8000 \
            devops-python-api

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "Deploy realizado com sucesso!"
              exit 0
            fi
            sleep 3
          done

          sudo docker logs devops-python-api
          exit 1
          REMOTE
